# Experience and education, newest first within each group.
# Shown on the CV page (content/cv.toml); there is no separate Experience page.
#
# Fields per entry:
#   title     role or degree (required)
#   subtitle  organisation or institution
#   date      period as you want it shown, e.g. "Jul 2026 – Dec 2026"
#   location  optional
#   status    optional badge, e.g. "Current"
#   details   optional list of extra lines (inline Markdown)
#   content   optional description (Markdown)
#   image     optional square logo in public/ (PNG or JPG), e.g. "/logos/lmu.png"
#   link      optional URL for the title
#   category  "Research Experience" or "Education" (controls the group)
#   hidden    set to true to keep an entry here without showing it

type = "card"
title = "Experience"
description = "Research positions and education."
layout = "timeline"
group_by = "category"
groups = ["Research Experience", "Education"]

